    for (const fe of this.flashEffects) fe.draw(ctx);

    ctx.restore();

    // 15. Screen flash (no camera shake applied)
    this.screenFlash.draw(ctx);
  }

  get totalParticleCount() {
    let count = 0;
    for (const key of Object.keys(this.pools)) {
      count += this.pools[key].count;
    }
    count += this.smokeLayerPool.count;
    return count;
  }
}

// ============================================================
// AMBIENT BACKGROUND GLOW SYSTEM
// ============================================================

class AmbientGlow {
  constructor() {
    this.glows = [];
    this.maxGlows = 12;
    this.decayRate = 0.85; // per second multiplier
  }

  addGlow(x, y) {
    this.glows.push({
      x,
      y,
      radius: randFloat(200, 500),
      maxRadius: randFloat(400, 900),
      alpha: randFloat(0.15, 0.35),
      age: 0,
      maxLife: randFloat(2.0, 4.0),
      r: 255,
      g: randInt(150, 230),
      b: randInt(20, 80),
      pulseSpeed: randFloat(1, 3),
      pulseAmt: randFloat(0.05, 0.15),
      pulseTimer: Math.random() * TWO_PI
    });
    if (this.glows.length > this.maxGlows) {
      this.glows.shift();
    }
  }

  update(dt) {
    for (let i = this.glows.length - 1; i >= 0; i--) {
      const g = this.glows[i];
      g.age += dt;
      g.pulseTimer += dt;
      if (g.age >= g.maxLife) {
        this.glows.splice(i, 1);
        continue;
      }
      const p = g.age / g.maxLife;
      if (p < 0.15) {
        g.alpha = lerp(0, 0.30, p / 0.15);
        g.radius = lerp(g.radius * 0.3, g.maxRadius * 0.7, easeOutQuad(p / 0.15));
      } else if (p > 0.5) {
        g.alpha = lerp(0.30, 0, (p - 0.5) / 0.5);
        g.radius = lerp(g.maxRadius * 0.7, g.maxRadius, (p - 0.5) / 0.5);
      } else {
        g.alpha = 0.30;
        g.radius = g.maxRadius * 0.7;
      }
    }
  }

  draw(ctx) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const g of this.glows) {
      if (g.alpha <= 0.005) continue;
      const pulse = 1 + g.pulseAmt * Math.sin(g.pulseTimer * g.pulseSpeed);
      const r = g.radius * pulse;
      ctx.globalAlpha = g.alpha;
      const grad = ctx.createRadialGradient(g.x, g.y, 0, g.x, g.y, r);
      grad.addColorStop(0, rgbaStr(g.r, g.g, g.b, 0.6));
      grad.addColorStop(0.4, rgbaStr(g.r, Math.max(0, g.g - 60), 0, 0.3));
      grad.addColorStop(0.7, rgbaStr(Math.min(255, g.r - 30), 0, 0, 0.1));
      grad.addColorStop(1, rgbaStr(0, 0, 0, 0));
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(g.x, g.y, r, 0, TWO_PI);
      ctx.fill();
    }
    ctx.restore();
  }
}

// ============================================================
// DIVINE RUNE SYSTEM (ancient symbols that appear briefly)
// ============================================================

class DivineRune {
  constructor() {
    this.active = false;
    this.x = 0;
    this.y = 0;
    this.radius = 0;
    this.age = 0;
    this.maxLife = 0;
    this.alpha = 0;
    this.rotation = 0;
    this.rotSpeed = 0;
    this.runeType = 0;
    this.numSymbols = 0;
    this.symbols = [];
    this.innerRadius = 0;
    this.outerRingAlpha = 0;
    this.segments = 0;
  }

  init(x, y) {
    this.active = true;
    this.x = x;
    this.y = y;
    this.radius = randFloat(100, 220);
    this.age = 0;
    this.maxLife = randFloat(1.2, 2.2);
    this.alpha = 0;
    this.rotation = randAngle();
    this.rotSpeed = randFloat(-1.5, 1.5);
    this.innerRadius = this.radius * randFloat(0.4, 0.7);
    this.runeType = randInt(0, 3);
    this.numSymbols = randInt(6, 12);
    this.segments = randInt(3, 8);

    this.symbols = [];
    for (let i = 0; i < this.numSymbols; i++) {
      this.symbols.push({
        angle: (i / this.numSymbols) * TWO_PI,
        size: randFloat(8, 18),
        type: randInt(0, 4),
        rotOffset: randAngle()
      });
    }
  }

  update(dt) {
    if (!this.active) return;
    this.age += dt;
    if (this.age >= this.maxLife) { this.active = false; return; }
    this.rotation += this.rotSpeed * dt;

    const p = this.age / this.maxLife;
    if (p < 0.12) {
      this.alpha = lerp(0, 1, p / 0.12);
    } else if (p > 0.65) {
      this.alpha = lerp(1, 0, (p - 0.65) / 0.35);
    } else {
      this.alpha = 1;
    }
  }

  drawSymbol(ctx, type, cx, cy, size, rotation) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rotation);
    ctx.beginPath();
    switch (type) {
      case 0: // Cross
        ctx.moveTo(-size, 0); ctx.lineTo(size, 0);
        ctx.moveTo(0, -size); ctx.lineTo(0, size);
        break;
      case 1: // Triangle
        for (let i = 0; i < 3; i++) {
          const a = (i / 3) * TWO_PI - Math.PI / 2;
          const px = Math.cos(a) * size;
          const py = Math.sin(a) * size;
          i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.closePath();
        break;
      case 2: // Diamond
        ctx.moveTo(0, -size);
        ctx.lineTo(size * 0.6, 0);
        ctx.lineTo(0, size);
        ctx.lineTo(-size * 0.6, 0);
        ctx.closePath();
        break;
      case 3: // Asterisk
        for (let i = 0; i < 6; i++) {
          const a = (i / 6) * TWO_PI;
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(a) * size, Math.sin(a) * size);
        }
        break;
      case 4: // Square
        ctx.rect(-size * 0.5, -size * 0.5, size, size);
        break;
    }
    ctx.restore();
  }

  draw(ctx) {
    if (!this.active || this.alpha <= 0.005) return;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);
    ctx.globalAlpha = this.alpha;

    const goldColor = rgbaStr(255, 220, 80, this.alpha);
    const brightColor = rgbaStr(255, 255, 180, this.alpha);
    const dimColor = rgbaStr(255, 200, 60, this.alpha * 0.6);

    ctx.shadowBlur = 15;
    ctx.shadowColor = rgbaStr(255, 240, 120, this.alpha * 0.8);

    // Outer ring
    ctx.strokeStyle = goldColor;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, this.radius, 0, TWO_PI);
    ctx.stroke();

    // Inner ring
    ctx.strokeStyle = dimColor;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0, 0, this.innerRadius, 0, TWO_PI);
    ctx.stroke();

    // Segment lines (like a compass)
    ctx.strokeStyle = goldColor;
    ctx.lineWidth = 1;
    for (let s = 0; s < this.segments; s++) {
      const a = (s / this.segments) * TWO_PI;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * this.innerRadius, Math.sin(a) * this.innerRadius);
      ctx.lineTo(Math.cos(a) * this.radius, Math.sin(a) * this.radius);
      ctx.stroke();
    }

    // Symbols along the ring
    ctx.strokeStyle = brightColor;
    ctx.fillStyle = rgbaStr(255, 255, 200, this.alpha * 0.3);
    ctx.lineWidth = 1.5;
    for (const sym of this.symbols) {
      const sx = Math.cos(sym.angle) * (this.innerRadius + (this.radius - this.innerRadius) * 0.5);
      const sy = Math.sin(sym.angle) * (this.innerRadius + (this.radius - this.innerRadius) * 0.5);
      this.drawSymbol(ctx, sym.type, sx, sy, sym.size, sym.angle + sym.rotOffset + this.rotation);
      ctx.stroke();
    }

    // Center cross
    ctx.strokeStyle = brightColor;
    ctx.lineWidth = 2;
    ctx.shadowBlur = 20;
    const cs = this.innerRadius * 0.5;
    ctx.beginPath();
    ctx.moveTo(-cs, 0); ctx.lineTo(cs, 0);
    ctx.moveTo(0, -cs); ctx.lineTo(0, cs);
    ctx.stroke();

    // Center dot
    ctx.fillStyle = rgbaStr(255, 255, 240, this.alpha * 0.9);
    ctx.shadowBlur = 25;
    ctx.beginPath();
    ctx.arc(0, 0, 5, 0, TWO_PI);
    ctx.fill();

    ctx.restore();
  }
}

// ============================================================
// LIGHTNING BOLT SYSTEM (divine lightning strikes)
// ============================================================

class LightningBolt {
  constructor() {
    this.active = false;
    this.segments = [];
    this.age = 0;
    this.maxLife = 0;
    this.alpha = 0;
    this.x1 = 0;
    this.y1 = 0;
    this.x2 = 0;
    this.y2 = 0;
    this.branches = [];
    this.flickerTimer = 0;
    this.flickerAlpha = 1;
  }

  generateSegments(x1, y1, x2, y2, roughness, depth) {
    if (depth <= 0 || Math.abs(x2 - x1) + Math.abs(y2 - y1) < 10) {
      return [{ x: x1, y: y1 }, { x: x2, y: y2 }];
    }
    const midX = (x1 + x2) * 0.5 + randFloat(-roughness, roughness);
    const midY = (y1 + y2) * 0.5 + randFloat(-roughness, roughness);
    const left = this.generateSegments(x1, y1, midX, midY, roughness * 0.6, depth - 1);
    const right = this.generateSegments(midX, midY, x2, y2, roughness * 0.6, depth - 1);
    right.shift();
    return [...left, ...right];
  }

  init(x1, y1, x2, y2) {
    this.active = true;
    this.x1 = x1; this.y1 = y1;
    this.x2 = x2; this.y2 = y2;
    this.age = 0;
    this.maxLife = randFloat(0.15, 0.4);
    this.alpha = 1;
    this.flickerTimer = 0;

    const roughness = Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2) * 0.25;
    this.segments = this.generateSegments(x1, y1, x2, y2, roughness, 6);

    this.branches = [];
    const numBranches = randInt(2, 5);
    for (let b = 0; b < numBranches; b++) {
      const startIdx = randInt(1, this.segments.length - 2);
      const start = this.segments[startIdx];
      const branchAngle = Math.atan2(y2 - y1, x2 - x1) + randFloat(-1.0, 1.0);
      const branchLen = randFloat(40, 120);
      const bx2 = start.x + Math.cos(branchAngle) * branchLen;
      const by2 = start.y + Math.sin(branchAngle) * branchLen;
      const broughness = branchLen * 0.3;
      this.branches.push({
        segments: this.generateSegments(start.x, start.y, bx2, by2, broughness, 4),
        alpha: randFloat(0.3, 0.7)
      });
    }
  }

  update(dt) {
    if (!this.active) return;
    this.age += dt;
    this.flickerTimer += dt;
    if (this.age >= this.maxLife) { this.active = false; return; }
    const p = this.age / this.maxLife;
    this.alpha = p < 0.1 ? 1 : Math.pow(1 - p, 1.5);
    // Flicker effect
    this.flickerAlpha = 0.7 + 0.3 * Math.sin(this.flickerTimer * 60);
  }

  drawSegmentList(ctx, segs, lineWidth, color) {
    if (segs.length < 2) return;
    ctx.beginPath();
    ctx.moveTo(segs[0].x, segs[0].y);
    for (let i = 1; i < segs.length; i++) {
      ctx.lineTo(segs[i].x, segs[i].y);
    }
    ctx.strokeStyle = color;
    ctx.lineWidth = lineWidth;
    ctx.stroke();
  }

  draw(ctx) {
    if (!this.active || this.alpha <= 0.005 || this.segments.length < 2) return;

    const fa = this.alpha * this.flickerAlpha;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = fa;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // Outer glow pass
    ctx.shadowBlur = 30;
    ctx.shadowColor = rgbaStr(255, 240, 150, fa * 0.8);
    this.drawSegmentList(ctx, this.segments, 6, rgbaStr(255, 220, 100, fa * 0.4));

    // Mid glow
    ctx.shadowBlur = 15;
    this.drawSegmentList(ctx, this.segments, 3, rgbaStr(255, 250, 200, fa * 0.7));

    // Core bright
    ctx.shadowBlur = 5;
    this.drawSegmentList(ctx, this.segments, 1.5, rgbaStr(255, 255, 255, fa));

    // Branches
    for (const branch of this.branches) {
      ctx.globalAlpha = fa * branch.alpha;
      ctx.shadowBlur = 10;
      ctx.shadowColor = rgbaStr(255, 240, 150, fa * branch.alpha * 0.6);
      this.drawSegmentList(ctx, branch.segments, 2, rgbaStr(255, 240, 150, fa * branch.alpha * 0.8));
      this.drawSegmentList(ctx, branch.segments, 1, rgbaStr(255, 255, 255, fa * branch.alpha));
    }

    ctx.restore();
  }
}

// ============================================================
// GOLDEN RING BURST (expanding golden rings from impact)
// ============================================================

class GoldenRingBurst {
  constructor() {
    this.active = false;
    this.x = 0;
    this.y = 0;
    this.rings = [];
    this.age = 0;
    this.maxLife = 0;
  }

  init(x, y) {
    this.active = true;
    this.x = x;
    this.y = y;
    this.age = 0;
    this.maxLife = randFloat(1.5, 2.5);
    this.rings = [];
    const numRings = randInt(5, 10);
    for (let i = 0; i < numRings; i++) {
      this.rings.push({
        radius: randFloat(30, 80),
        maxRadius: randFloat(200, 600),
        age: 0,
        delay: i * randFloat(0.03, 0.08),
        maxLife: randFloat(0.8, 1.5),
        alpha: 0,
        active: true,
        thickness: randFloat(1, 3),
        r: 255,
        g: randInt(200, 250),
        b: randInt(80, 150)
      });
    }
  }

  update(dt) {
    if (!this.active) return;
    this.age += dt;
    let anyActive = false;
    for (const ring of this.rings) {
      if (!ring.active) continue;
      ring.age += dt;
      const eff = ring.age - ring.delay;
      if (eff <= 0) { anyActive = true; continue; }
      const p = eff / ring.maxLife;
      if (p >= 1) { ring.active = false; continue; }
      anyActive = true;
      ring.radius = ring.maxRadius * easeOutCubic(p);
      ring.alpha = p < 0.1 ? lerp(0, 0.9, p / 0.1) : Math.pow(1 - p, 2.0) * 0.9;
    }
    if (!anyActive) this.active = false;
  }

  draw(ctx) {
    if (!this.active) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const ring of this.rings) {
      if (!ring.active || ring.alpha <= 0.005 || ring.radius <= 0) continue;
      ctx.globalAlpha = ring.alpha;
      ctx.shadowBlur = ring.thickness * 8;
      ctx.shadowColor = rgbaStr(ring.r, ring.g, ring.b, ring.alpha * 0.8);
      ctx.strokeStyle = rgbaStr(ring.r, ring.g, ring.b, ring.alpha);
      ctx.lineWidth = ring.thickness;
      ctx.beginPath();
      ctx.arc(this.x, this.y, ring.radius, 0, TWO_PI);
      ctx.stroke();
    }
    ctx.restore();
  }
}

// ============================================================
// GROUND SCORCH (persistent ground effect)
// ============================================================

class GroundScorch {
  constructor() {
    this.active = false;
    this.x = 0;
    this.y = 0;
    this.radius = 0;
    this.age = 0;
    this.maxLife = 8.0;
    this.alpha = 0;
  }

  init(x, y) {
    this.active = true;
    this.x = x;
    this.y = y;
    this.radius = randFloat(80, 180);
    this.age = 0;
    this.maxLife = randFloat(5, 10);
    this.alpha = 0;
  }

  update(dt) {
    if (!this.active) return;
    this.age += dt;
    if (this.age >= this.maxLife) { this.active = false; return; }
    const p = this.age / this.maxLife;
    if (p < 0.1) {
      this.alpha = lerp(0, 0.6, p / 0.1);
    } else if (p > 0.7) {
      this.alpha = lerp(0.6, 0, (p - 0.7) / 0.3);
    } else {
      this.alpha = 0.6;
    }
  }

  draw(ctx) {
    if (!this.active || this.alpha <= 0.005) return;
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = this.alpha * 0.5;
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
    grad.addColorStop(0, rgbaStr(20, 10, 5, 0.8));
    grad.addColorStop(0.5, rgbaStr(30, 15, 5, 0.5));
    grad.addColorStop(0.8, rgbaStr(40, 20, 8, 0.2));
    grad.addColorStop(1, rgbaStr(0, 0, 0, 0));
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(this.x, this.y, this.radius, this.radius * 0.35, 0, 0, TWO_PI);
    ctx.fill();
    ctx.restore();
  }
}

// ============================================================
// EXTENDED EXPLOSION MANAGER (with all extra systems)
// ============================================================

class FullExplosionManager extends ExplosionManager {
  constructor() {
    super();
    this.ambientGlow = new AmbientGlow();
    this.divineRunes = [];
    this.lightningBolts = [];
    this.goldenRingBursts = [];
    this.groundScorches = [];
    this.goldenRingBurstPool = [];
    this.prevTime = 0;
  }

  triggerExplosion(x, y) {
    super.triggerExplosion(x, y);

    // Ambient glow
    this.ambientGlow.addGlow(x, y);
    this.ambientGlow.addGlow(x + randFloat(-80, 80), y + randFloat(-40, 40));

    // Divine rune
    if (Math.random() > 0.3) {
      const rune = new DivineRune();
      rune.init(x, y);
      this.divineRunes.push(rune);
      // Second outer rune
      if (Math.random() > 0.5) {
        const rune2 = new DivineRune();
        rune2.init(x, y);
        rune2.radius = rune.radius * 1.8;
        rune2.innerRadius = rune2.radius * 0.5;
        rune2.rotSpeed *= -1;
        this.divineRunes.push(rune2);
      }
    }

    // Lightning bolts from sky
    const numLightning = randInt(2, 5);
    for (let l = 0; l < numLightning; l++) {
      const lb = new LightningBolt();
      const lx = x + randFloat(-150, 150);
      lb.init(lx, -50, x + randFloat(-30, 30), y);
      this.lightningBolts.push(lb);
    }

    // Deferred lightning
    this.deferredEmissions.push({
      delay: randFloat(0.08, 0.2),
      age: 0,
      fired: false,
      fn: () => {
        const numLB = randInt(1, 3);
        for (let l = 0; l < numLB; l++) {
          const lb = new LightningBolt();
          lb.init(x + randFloat(-180, 180), -50, x + randFloat(-50, 50), y);
          this.lightningBolts.push(lb);
        }
      }
    });

    // Golden ring burst
    const grb = new GoldenRingBurst();
    grb.init(x, y);
    this.goldenRingBursts.push(grb);

    // Ground scorch
    const gs = new GroundScorch();
    gs.init(x, y);
    this.groundScorches.push(gs);
  }

  update(dt) {
    super.update(dt);
    this.ambientGlow.update(dt);

    for (let i = this.divineRunes.length - 1; i >= 0; i--) {
      this.divineRunes[i].update(dt);
      if (!this.divineRunes[i].active) this.divineRunes.splice(i, 1);
    }
    for (let i = this.lightningBolts.length - 1; i >= 0; i--) {
      this.lightningBolts[i].update(dt);
      if (!this.lightningBolts[i].active) this.lightningBolts.splice(i, 1);
    }
    for (let i = this.goldenRingBursts.length - 1; i >= 0; i--) {
      this.goldenRingBursts[i].update(dt);
      if (!this.goldenRingBursts[i].active) this.goldenRingBursts.splice(i, 1);
    }
    for (let i = this.groundScorches.length - 1; i >= 0; i--) {
      this.groundScorches[i].update(dt);
      if (!this.groundScorches[i].active) this.groundScorches.splice(i, 1);
    }
  }

  draw(ctx) {
    // Ground scorches (very back)
    ctx.save();
    for (const gs of this.groundScorches) gs.draw(ctx);
    ctx.restore();

    // Ambient glow (behind everything)
    this.ambientGlow.draw(ctx);

    // Main explosion
    super.draw(ctx);

    // Additional effects on top
    ctx.save();
    // Divine runes
    for (const rune of this.divineRunes) rune.draw(ctx);
    // Lightning
    for (const lb of this.lightningBolts) lb.draw(ctx);
    // Golden rings
    for (const grb of this.goldenRingBursts) grb.draw(ctx);
    ctx.restore();
  }
}

// ============================================================
// BACKGROUND STAR FIELD (ambient depth)
// ============================================================

class StarField {
  constructor(count) {
    this.stars = [];
    for (let i = 0; i < count; i++) {
      this.stars.push({
        x: Math.random() * 2000,
        y: Math.random() * 2000,
        r: randFloat(0.3, 1.5),
        alpha: randFloat(0.1, 0.6),
        twinkleSpeed: randFloat(0.5, 2.0),
        twinkleTimer: Math.random() * TWO_PI
      });
    }
  }

  update(dt) {
    for (const star of this.stars) {
      star.twinkleTimer += dt;
      star.alpha = 0.1 + 0.5 * (0.5 + 0.5 * Math.sin(star.twinkleTimer * star.twinkleSpeed));
    }
  }

  draw(ctx) {
    ctx.save();
    ctx.fillStyle = '#ffffff';
    for (const star of this.stars) {
      const sx = (star.x / 2000) * W;
      const sy = (star.y / 2000) * H;
      ctx.globalAlpha = star.alpha * 0.3;
      ctx.beginPath();
      ctx.arc(sx, sy, star.r, 0, TWO_PI);
      ctx.fill();
    }
    ctx.restore();
  }
}

// ============================================================
// MAIN LOOP
// ============================================================

const explosionManager = new FullExplosionManager();
const starField = new StarField(200);

let lastTime = 0;
let frameCount = 0;
let fpsTimer = 0;
let fps = 60;

// Trail/persistence settings
const TRAIL_ALPHA = 0.18;

function clearCanvas() {
  ctx.save();
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = TRAIL_ALPHA;
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

function update(dt) {
  starField.update(dt);
  explosionManager.update(dt);
}

function draw() {
  clearCanvas();

  // Background stars
  starField.draw(ctx);

  // All explosion effects
  explosionManager.draw(ctx);
}

function loop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05); // cap at 50ms
  lastTime = timestamp;

  frameCount++;
  fpsTimer += dt;
  if (fpsTimer >= 0.5) {
    fps = Math.round(frameCount / fpsTimer);
    frameCount = 0;
    fpsTimer = 0;
  }

  update(dt);
  draw();

  // Update particle count display
  const totalParticles = explosionManager.totalParticleCount;
  if (particleCountDisplay) {
    particleCountDisplay.textContent =
      `particles: ${totalParticles.toLocaleString()} | fps: ${fps}`;
  }

  requestAnimationFrame(loop);
}

// ============================================================
// INPUT HANDLING
// ============================================================

function handlePointerDown(e) {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;

  let clientX, clientY;
  if (e.touches) {
    clientX = e.touches[0].clientX;
    clientY = e.touches[0].clientY;
  } else {
    clientX = e.clientX;
    clientY = e.clientY;
  }

  const x = (clientX - rect.left) * scaleX;
  const y = (clientY - rect.top) * scaleY;

  explosionManager.triggerExplosion(x, y);
}

canvas.addEventListener('mousedown', handlePointerDown);
canvas.addEventListener('touchstart', handlePointerDown, { passive: false });

// Prevent context menu on right-click
canvas.addEventListener('contextmenu', e => e.preventDefault());

// Right-click also triggers
canvas.addEventListener('mousedown', e => {
  if (e.button === 2) {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    explosionManager.triggerExplosion(x, y);
  }
});

// Hide hint after first click
let hintHidden = false;
const hint = document.getElementById('hint');
canvas.addEventListener('mousedown', () => {
  if (!hintHidden) {
    hintHidden = true;
    hint.style.transition = 'opacity 1s';
    hint.style.opacity = '0';
    setTimeout(() => { hint.style.display = 'none'; }, 1000);
  }
}, { once: false });

// ============================================================
// STARTUP DEMO EXPLOSION
// ============================================================

function playIntroExplosion() {
  setTimeout(() => {
    explosionManager.triggerExplosion(W * 0.5, H * 0.5);
  }, 400);
}

// ============================================================
// START
// ============================================================

requestAnimationFrame((ts) => {
  lastTime = ts;
  playIntroExplosion();
  requestAnimationFrame(loop);
});
